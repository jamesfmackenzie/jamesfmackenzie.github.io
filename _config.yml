# Site settings
title: James Mackenzie
#host: 0.0.0.0
url: https://www.jamesfmackenzie.com
description: "I fix (and break) old computers on the internet! This is where I share all the behind-the-scenes bits — project files, fixes, quirks, and technical notes. Take whatever helps, and enjoy your own retro adventures!"
permalink: pretty
future: false

# keep dev/agent files out of the build (this list replaces Jekyll's defaults,
# so the standard entries are repeated here)
exclude:
  - CLAUDE.md
  - .sass-cache
  - .jekyll-cache
  - gemfiles
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# collections (i.e. not posts)
collections:
  projects:
    output: true
    permalink: /:collection/:path/
  howto:
    output: true
    permalink: /:collection/:path/
  hardware:
    output: true
    permalink: /:collection/:path/
  software:
    output: true
    permalink: /:collection/:path/
  reference:
    output: true
    permalink: /:collection/:path/

# plugins
plugins:
  - jekyll-redirect-from
