<svg xmlns="http://www.w3.org/2000/svg" width="760" height="480" viewBox="0 0 760 480" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>How much of a DOS sound card VSBHDA, SBEMU and a native card with a DMA trapper replace with software</title>
  <rect width="760" height="480" fill="#ffffff"/>
  <rect x="205" y="20" width="170" height="56" rx="8" fill="#ffffff" stroke="#8a939a" stroke-width="1.5"/>
  <text x="290.0" y="45" font-size="15" font-weight="700" fill="#23282d" text-anchor="middle">VSBHDA</text>
  <text x="290.0" y="63" font-size="12.5" fill="#6a747e" text-anchor="middle">most software</text>
  <rect x="390" y="20" width="170" height="56" rx="8" fill="#ffffff" stroke="#8a939a" stroke-width="1.5"/>
  <text x="475.0" y="45" font-size="15" font-weight="700" fill="#23282d" text-anchor="middle">SBEMU</text>
  <text x="475.0" y="63" font-size="12.5" fill="#6a747e" text-anchor="middle">mostly software</text>
  <rect x="575" y="20" width="170" height="56" rx="8" fill="#e3f1ee" stroke="#0f8576" stroke-width="1.5"/>
  <text x="660.0" y="45" font-size="13" font-weight="700" fill="#23282d" text-anchor="middle">Native card + DMA trapper</text>
  <text x="660.0" y="63" font-size="12.5" fill="#6a747e" text-anchor="middle">least software</text>
  <text x="190" y="125" font-size="13.5" font-weight="700" fill="#23282d" text-anchor="end">Game's SB commands</text>
  <rect x="205" y="96" width="170" height="50" rx="8" fill="#f8f5ef" stroke="#e5dfd4" stroke-width="1.5"/>
  <text x="290.0" y="117" font-size="13" font-weight="700" fill="#23282d" text-anchor="middle">Emulated</text>
  <text x="290.0" y="134" font-size="11.5" fill="#6a747e" text-anchor="middle">software SB DSP</text>
  <rect x="390" y="96" width="170" height="50" rx="8" fill="#f8f5ef" stroke="#e5dfd4" stroke-width="1.5"/>
  <text x="475.0" y="117" font-size="13" font-weight="700" fill="#23282d" text-anchor="middle">Emulated</text>
  <text x="475.0" y="134" font-size="11.5" fill="#6a747e" text-anchor="middle">software SB DSP</text>
  <rect x="575" y="96" width="170" height="50" rx="8" fill="#e3f1ee" stroke="#0f8576" stroke-width="1.5"/>
  <text x="660.0" y="117" font-size="13" font-weight="700" fill="#0c6f62" text-anchor="middle">Real card</text>
  <text x="660.0" y="134" font-size="11.5" fill="#6a747e" text-anchor="middle">answers directly</text>
  <text x="190" y="183" font-size="13.5" font-weight="700" fill="#23282d" text-anchor="end">Game's DMA setup</text>
  <rect x="205" y="154" width="170" height="50" rx="8" fill="#f8f5ef" stroke="#e5dfd4" stroke-width="1.5"/>
  <text x="290.0" y="175" font-size="13" font-weight="700" fill="#23282d" text-anchor="middle">Trapped and</text>
  <text x="290.0" y="192" font-size="11.5" fill="#6a747e" text-anchor="middle">emulated (virtual 8237)</text>
  <rect x="390" y="154" width="170" height="50" rx="8" fill="#f8f5ef" stroke="#e5dfd4" stroke-width="1.5"/>
  <text x="475.0" y="175" font-size="13" font-weight="700" fill="#23282d" text-anchor="middle">Trapped and</text>
  <text x="475.0" y="192" font-size="11.5" fill="#6a747e" text-anchor="middle">emulated (virtual 8237)</text>
  <rect x="575" y="154" width="170" height="50" rx="8" fill="#f8f5ef" stroke="#e5dfd4" stroke-width="1.5"/>
  <text x="660.0" y="175" font-size="13" font-weight="700" fill="#23282d" text-anchor="middle">Trapped, then</text>
  <text x="660.0" y="192" font-size="11.5" fill="#6a747e" text-anchor="middle">forwarded to the card</text>
  <text x="190" y="241" font-size="13.5" font-weight="700" fill="#23282d" text-anchor="end">Moving the samples</text>
  <rect x="205" y="212" width="170" height="50" rx="8" fill="#f8f5ef" stroke="#e5dfd4" stroke-width="1.5"/>
  <text x="290.0" y="233" font-size="13" font-weight="700" fill="#23282d" text-anchor="middle">CPU copy into</text>
  <text x="290.0" y="250" font-size="11.5" fill="#6a747e" text-anchor="middle">a native-mode buffer</text>
  <rect x="390" y="212" width="170" height="50" rx="8" fill="#f8f5ef" stroke="#e5dfd4" stroke-width="1.5"/>
  <text x="475.0" y="233" font-size="13" font-weight="700" fill="#23282d" text-anchor="middle">CPU copy into</text>
  <text x="475.0" y="250" font-size="11.5" fill="#6a747e" text-anchor="middle">a native-mode buffer</text>
  <rect x="575" y="212" width="170" height="50" rx="8" fill="#e3f1ee" stroke="#0f8576" stroke-width="1.5"/>
  <text x="660.0" y="233" font-size="13" font-weight="700" fill="#0c6f62" text-anchor="middle">Card's own</text>
  <text x="660.0" y="250" font-size="11.5" fill="#6a747e" text-anchor="middle">bus-master DMA</text>
  <text x="190" y="299" font-size="13.5" font-weight="700" fill="#23282d" text-anchor="end">Interrupts</text>
  <rect x="205" y="270" width="170" height="50" rx="8" fill="#f8f5ef" stroke="#e5dfd4" stroke-width="1.5"/>
  <text x="290.0" y="291" font-size="13" font-weight="700" fill="#23282d" text-anchor="middle">Virtual IRQ</text>
  <text x="290.0" y="308" font-size="11.5" fill="#6a747e" text-anchor="middle">(virtual PIC)</text>
  <rect x="390" y="270" width="170" height="50" rx="8" fill="#f8f5ef" stroke="#e5dfd4" stroke-width="1.5"/>
  <text x="475.0" y="291" font-size="13" font-weight="700" fill="#23282d" text-anchor="middle">Virtual IRQ</text>
  <text x="475.0" y="308" font-size="11.5" fill="#6a747e" text-anchor="middle">(virtual PIC)</text>
  <rect x="575" y="270" width="170" height="50" rx="8" fill="#e3f1ee" stroke="#0f8576" stroke-width="1.5"/>
  <text x="660.0" y="291" font-size="13" font-weight="700" fill="#0c6f62" text-anchor="middle">Real IRQ line</text>
  <text x="660.0" y="308" font-size="11.5" fill="#6a747e" text-anchor="middle">straight to the game</text>
  <text x="190" y="357" font-size="13.5" font-weight="700" fill="#23282d" text-anchor="end">FM music</text>
  <rect x="205" y="328" width="170" height="50" rx="8" fill="#f8f5ef" stroke="#e5dfd4" stroke-width="1.5"/>
  <text x="290.0" y="349" font-size="13" font-weight="700" fill="#23282d" text-anchor="middle">Emulated OPL3</text>
  <text x="290.0" y="366" font-size="11.5" fill="#6a747e" text-anchor="middle">(software)</text>
  <rect x="390" y="328" width="170" height="50" rx="8" fill="#e3f1ee" stroke="#0f8576" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="475.0" y="349" font-size="13" font-weight="700" fill="#0c6f62" text-anchor="middle">Card's real OPL3</text>
  <text x="475.0" y="366" font-size="11.5" fill="#6a747e" text-anchor="middle">if reachable</text>
  <rect x="575" y="328" width="170" height="50" rx="8" fill="#e3f1ee" stroke="#0f8576" stroke-width="1.5"/>
  <text x="660.0" y="358" font-size="13" font-weight="700" fill="#0c6f62" text-anchor="middle">Card's real OPL3</text>
  <text x="190" y="415" font-size="13.5" font-weight="700" fill="#23282d" text-anchor="end">Role of the card</text>
  <rect x="205" y="386" width="170" height="50" rx="8" fill="#f8f5ef" stroke="#e5dfd4" stroke-width="1.5"/>
  <text x="290.0" y="407" font-size="13" font-weight="700" fill="#23282d" text-anchor="middle">Output device only</text>
  <text x="290.0" y="424" font-size="11.5" fill="#6a747e" text-anchor="middle">(native mode)</text>
  <rect x="390" y="386" width="170" height="50" rx="8" fill="#f8f5ef" stroke="#e5dfd4" stroke-width="1.5"/>
  <text x="475.0" y="407" font-size="13" font-weight="700" fill="#23282d" text-anchor="middle">Output device,</text>
  <text x="475.0" y="424" font-size="11.5" fill="#6a747e" text-anchor="middle">plus FM if reachable</text>
  <rect x="575" y="386" width="170" height="50" rx="8" fill="#e3f1ee" stroke="#0f8576" stroke-width="1.5"/>
  <text x="660.0" y="407" font-size="13" font-weight="700" fill="#0c6f62" text-anchor="middle">The whole</text>
  <text x="660.0" y="424" font-size="11.5" fill="#6a747e" text-anchor="middle">sound card</text>
  <rect x="205" y="452" width="18" height="14" rx="3" fill="#f8f5ef" stroke="#e5dfd4" stroke-width="1.5"/>
  <text x="230" y="464" font-size="12.5" fill="#6a747e">done in software</text>
  <rect x="365" y="452" width="18" height="14" rx="3" fill="#e3f1ee" stroke="#0f8576" stroke-width="1.5"/>
  <text x="390" y="464" font-size="12.5" fill="#6a747e">done by the real card</text>
  <rect x="545" y="452" width="18" height="14" rx="3" fill="#e3f1ee" stroke="#0f8576" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="570" y="464" font-size="12.5" fill="#6a747e">real card, if reachable</text>
</svg>
