<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>How disassembly, decompilation, static recompilation, emulation and porting relate</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a939a"/>
    </marker>
  </defs>
  <rect width="760" height="470" fill="#ffffff"/>

  <!-- arrows -->
  <g fill="none" stroke="#8a939a" stroke-width="1.6" marker-end="url(#arrow)">
    <path d="M170 172 C 225 172, 250 48, 336 48"/>
    <path d="M170 186 C 225 186, 250 138, 336 138"/>
    <path d="M170 204 C 225 204, 250 228, 336 228"/>
    <path d="M170 218 C 225 218, 250 318, 336 318"/>
    <path d="M510 48 L 586 48"/>
    <path d="M510 126 L 586 126"/>
    <path d="M510 154 C 560 154, 560 232, 586 232"/>
    <path d="M510 228 C 548 228, 548 264, 586 264"/>
    <path d="M170 415 C 500 415, 667 410, 667 299"/>
  </g>

  <!-- method labels, beside the arrow ends -->
  <g font-size="13" font-style="italic" fill="#0f8576">
    <g text-anchor="end">
      <text x="330" y="38">disassemble</text>
      <text x="330" y="128">decompile</text>
      <text x="330" y="218">recompile</text>
      <text x="330" y="338">emulate</text>
    </g>
    <text x="548" y="40" text-anchor="middle">reassemble</text>
    <text x="548" y="118" text-anchor="middle">rebuild</text>
    <text x="562" y="176">port</text>
    <text x="514" y="220">compile</text>
    <text x="516" y="286">+ runtime</text>
    <text x="430" y="406">port</text>
  </g>

  <!-- boxes -->
  <g stroke="#e5dfd4" stroke-width="1.5">
    <rect x="20" y="140" width="150" height="110" rx="8" fill="#f8f5ef"/>
    <rect x="20" y="380" width="150" height="70" rx="8" fill="#f8f5ef"/>
    <rect x="340" y="20" width="170" height="56" rx="8" fill="#ffffff"/>
    <rect x="340" y="110" width="170" height="56" rx="8" fill="#ffffff"/>
    <rect x="340" y="200" width="170" height="56" rx="8" fill="#ffffff" stroke="#8a939a" stroke-dasharray="5 4"/>
    <rect x="340" y="290" width="170" height="56" rx="8" fill="#f4f4f2"/>
    <rect x="590" y="20" width="155" height="146" rx="8" fill="#f8f5ef"/>
    <rect x="590" y="215" width="155" height="80" rx="8" fill="#e3f1ee" stroke="#0f8576"/>
  </g>

  <g fill="#23282d" text-anchor="middle">
    <text x="95" y="186" font-size="15" font-weight="700">Shipped game</text>
    <text x="95" y="206" font-size="12.5" fill="#6a747e">machine code on a</text>
    <text x="95" y="222" font-size="12.5" fill="#6a747e">cartridge or disc</text>

    <text x="95" y="410" font-size="15" font-weight="700">Original source</text>
    <text x="95" y="429" font-size="12.5" fill="#6a747e">official or leaked</text>

    <text x="425" y="44" font-size="14.5" font-weight="700">Assembly</text>
    <text x="425" y="62" font-size="12.5" fill="#6a747e">named and documented</text>

    <text x="425" y="134" font-size="14.5" font-weight="700">C source</text>
    <text x="425" y="152" font-size="12.5" fill="#6a747e">readable, maintainable</text>

    <text x="425" y="224" font-size="14.5" font-weight="700">Generated C</text>
    <text x="425" y="242" font-size="12.5" fill="#6a747e">intermediate, patchable</text>

    <text x="425" y="314" font-size="14.5" font-weight="700" fill="#8a939a">Emulator</text>
    <text x="425" y="332" font-size="12.5" fill="#8a939a">runs the original as-is</text>

    <text x="667" y="86" font-size="14.5" font-weight="700">The original game</text>
    <text x="667" y="104" font-size="12.5" fill="#6a747e">rebuilt byte for byte</text>

    <text x="667" y="249" font-size="15" font-weight="700" fill="#0c6f62">A port</text>
    <text x="667" y="268" font-size="12.5">runs natively on</text>
    <text x="667" y="284" font-size="12.5">a new platform</text>
  </g>
</svg>
